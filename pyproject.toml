[project]
name = "notas"
version = "0.1.0"
description = "Caderno local a partir de um grupo privado do Telegram"
authors = [
    { name = "Ricardo Augusto", email = "ricardo.rals.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "publicsuffixlist>=1.1.2.20261105",
    "python-multipart>=0.0.33",
    "python-telegram-bot>=21",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: testes de desempenho"]
